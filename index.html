    <!-- Eradicate Lovable badge / watermarks -->
    <script>
      (function () {
        function purgeLovableBadges() {
          try {
            var selectors = [
              '#lovable-badge',
              '[id^="lovable-badge"]',
              '[id*="lovable-badge"]',
              '.lovable-badge',
              '[class*="lovable-badge"]',
              '[class*="lovable_badge"]',
              'lovable-badge',
              'a[href*="lovable.dev"]',
              'a[href*="lovable.app"]',
              'a[aria-label*="Lovable" i]',
              'a[aria-label*="Edit with Lovable" i]'
            ];
            selectors.forEach(function (sel) {
              var nodes = document.querySelectorAll(sel);
              for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                if (node && node.parentNode) {
                  node.parentNode.removeChild(node);
                }
              }
            });
          } catch (_) {}
        }
        purgeLovableBadges();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purgeLovableBadges);
        }
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(purgeLovableBadges);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>

  <body>
    <script>
      // Force LIGHT mode by default; only apply dark if user explicitly chose it
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
