name: Edge Functions Pre-Deploy

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'scripts/check-edge-functions.sh'
      - '.github/workflows/edge-functions-check.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'scripts/check-edge-functions.sh'
      - '.github/workflows/edge-functions-check.yml'
  workflow_dispatch:

jobs:
  pre-deploy:
    name: TypeScript + Bundle Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Lint (parse errors / unclosed blocks)
        run: deno lint supabase/functions

      - name: Pre-deploy check (compile + bundle dry-run)
        run: bash scripts/check-edge-functions.sh
