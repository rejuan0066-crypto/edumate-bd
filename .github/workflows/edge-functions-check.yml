name: Edge Functions Pre-Deploy

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'scripts/check-edge-functions.sh'
      - 'scripts/check-edge-function-env.sh'
      - '.github/workflows/edge-functions-check.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'scripts/check-edge-functions.sh'
      - 'scripts/check-edge-function-env.sh'
      - '.github/workflows/edge-functions-check.yml'
  workflow_dispatch:

jobs:
  pre-deploy:
    name: TypeScript + Bundle + Env Check
    runs-on: ubuntu-latest
    # Required env for the env-check step. Wire repository/organization
    # secrets here so the manifest's `required` list can be validated.
    env:
      # Supabase platform-injected (always required)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Function-specific (extend as you add functions / secrets)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # Pin Deno's module + typecheck cache to a known location so
      # actions/cache can persist it across runs.
      DENO_DIR: ${{ github.workspace }}/.deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      # Cache Deno's download + typecheck artifacts. Key on the contents of
      # every edge function index.ts + the shared deno.json so the cache
      # invalidates only when imports/config actually change. Falls back to
      # the most recent cache on the same OS for partial hits.
      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/**/index.ts', 'supabase/functions/**/deps.ts') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Warm the cache up-front so the pre-deploy gate doesn't pay the
      # download cost inside its own per-function loop.
      - name: Warm Deno cache
        run: |
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ ${#files[@]} -gt 0 ]; then
            deno cache --no-lock "${files[@]}"
          fi

      - name: Pre-deploy gate (lint + fmt + compile + bundle dry-run)
        run: bash scripts/check-edge-functions.sh

      - name: Validate edge function env vars
        run: bash scripts/check-edge-function-env.sh
