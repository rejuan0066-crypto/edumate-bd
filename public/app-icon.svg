<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0f766e"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

  <!-- Student with turban -->
  <g transform="translate(256, 200)">
    <!-- Head -->
    <circle cx="0" cy="20" r="60" fill="#ffffff"/>
    <!-- Turban base -->
    <ellipse cx="0" cy="-15" rx="72" ry="48" fill="#f0fdfa"/>
    <ellipse cx="0" cy="-25" rx="62" ry="38" fill="#ffffff"/>
    <!-- Turban wraps -->
    <path d="M-50 -10 Q0 18 50 -10" stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-44 -22 Q0 6 44 -22" stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Cap dome -->
    <ellipse cx="0" cy="-45" rx="26" ry="16" fill="#0f766e"/>
    <circle cx="0" cy="-55" r="4" fill="#fbbf24"/>
  </g>

  <!-- Open book -->
  <g transform="translate(256, 360)">
    <rect x="-110" y="-40" width="220" height="90" rx="8" fill="#ffffff"/>
    <rect x="-104" y="-34" width="100" height="78" rx="3" fill="#f0fdfa"/>
    <rect x="4" y="-34" width="100" height="78" rx="3" fill="#f0fdfa"/>
    <line x1="0" y1="-40" x2="0" y2="50" stroke="#0f766e" stroke-width="3"/>
    <!-- Lines on pages -->
    <line x1="-90" y1="-18" x2="-18" y2="-18" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
    <line x1="-90" y1="-4" x2="-18" y2="-4" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
    <line x1="-90" y1="10" x2="-30" y2="10" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
    <line x1="18" y1="-18" x2="90" y2="-18" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
    <line x1="18" y1="-4" x2="90" y2="-4" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
    <line x1="18" y1="10" x2="78" y2="10" stroke="#0f766e" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Star accent -->
  <g transform="translate(420, 90)" fill="#fbbf24">
    <circle cx="0" cy="0" r="14"/>
  </g>
  <g transform="translate(92, 92)" fill="#ffffff" opacity="0.4">
    <circle cx="0" cy="0" r="8"/>
  </g>
</svg>
