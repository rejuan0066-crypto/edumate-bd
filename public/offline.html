<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>অফলাইন — সুবহানিয়া</title>
<link rel="icon" href="/app-icon.svg" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --bg2: #020617;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
    --fg: #f8fafc;
    --muted: #94a3b8;
    --accent: #10b981;
    --accent2: #059669;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100dvh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SolaimanLipi", "Noto Sans Bengali", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(16,185,129,0.18), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(59,130,246,0.15), transparent 60%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--fg);
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
  }
  .icon {
    width: 84px; height: 84px; margin: 0 auto 20px;
    border-radius: 24px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 18px 40px -12px rgba(16,185,129,0.55);
  }
  .icon svg { width: 44px; height: 44px; color: #fff; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  p  { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    appearance: none; border: 0; cursor: pointer;
    padding: 12px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .primary {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 28px -10px rgba(16,185,129,0.6);
  }
  .primary:hover { transform: translateY(-1px); }
  .ghost {
    color: var(--fg);
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
  }
  .status {
    margin-top: 18px; font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <path d="M12 20h.01"/>
      </svg>
    </div>
    <h1>আপনি এখন অফলাইন</h1>
    <p>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। সংযোগ ফিরে এলে পেজটি আবার লোড করুন।</p>
    <div class="row">
      <button class="primary" onclick="location.reload()">আবার চেষ্টা করুন</button>
      <button class="ghost" onclick="history.back()">পেছনে যান</button>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="txt">অফলাইন</span></div>
  </main>
  <script>
    const dot = document.getElementById('dot');
    const txt = document.getElementById('txt');
    function sync() {
      const on = navigator.onLine;
      dot.classList.toggle('online', on);
      txt.textContent = on ? 'সংযোগ ফিরে এসেছে — রিলোড করুন' : 'অফলাইন';
      if (on) setTimeout(() => location.reload(), 800);
    }
    window.addEventListener('online', sync);
    window.addEventListener('offline', sync);
    sync();
  </script>
</body>
</html>
